<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dewanya Nyemil - Order Dimsum, Mie Ayam, Kebab &amp; Minuman</title>
    <meta name="description"
        content="Pilih jajananmu langsung di halaman ini: dimsum, mie ayam, kebab berger, dan seri minuman. Atur jumlah dan opsi, lalu kirim ke WhatsApp.">
    <meta name="keywords"
        content="Dewanya Nyemil, dimsum, mie ayam, kebab berger, minuman segar, jajanan, order WhatsApp">
    <link rel="canonical" href="https://dewanyanyemil.siin.qzz.io/">

    <meta property="og:title" content="Dewanya Nyemil - Pilih Jajanan, Order Langsung">
    <meta property="og:description"
        content="Dimsum, mie ayam, kebab berger, dan seri minuman. Pilih, atur jumlah, langsung ke WhatsApp.">
    <meta property="og:url" content="https://dewanyanyemil.siin.qzz.io/">
    <meta property="og:image" content="assets/img/hero.svg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dewanya Nyemil - Pilih Jajanan, Order Langsung">
    <meta name="twitter:description" content="Pilih dimsum, mie ayam, kebab, dan minuman - order langsung ke WhatsApp.">
    <meta name="twitter:image" content="assets/img/hero.svg">

    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link rel="apple-touch-icon" href="assets/img/favicon.svg">
    <meta name="theme-color" content="#D92727">
    <meta name="format-detection" content="telephone=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/style.css?v=dn016">
</head>

<body class="page-order">

    <!-- ===================== HEADER (tipis) ===================== -->
    <header class="site-head">
        <div class="wrap site-head__inner">
            <a href="#" class="brand" aria-label="Dewanya Nyemil">
                <span class="brand__logo" aria-hidden="true"><i class="fas fa-bowl-food"></i></span>
                <span class="brand__text">
                    <span class="brand__name">Dewanya Nyemil</span>
                    <span class="brand__tag">Pilih jajanan · order langsung</span>
                </span>
            </a>

            <div class="head-actions">
                <a href="#" class="head-wa" data-order-now aria-label="Chat WhatsApp">
                    <i class="fab fa-whatsapp" aria-hidden="true"></i>
                    <span class="head-wa__txt">Chat</span>
                </a>
            </div>
        </div>
    </header>

    <!-- ===================== STICKY SEARCH + KATEGORI ===================== -->
    <div class="menu-bar" id="menu-bar">
        <div class="wrap">
            <div class="menu-bar__row">
                <div class="menu-search">
                    <i class="fas fa-magnifying-glass ico" aria-hidden="true"></i>
                    <input id="menu-search" type="search" placeholder="Cari jajanan..." aria-label="Cari jajanan"
                        autocomplete="off" enterkeyhint="search">
                    <button class="menu-search__clear" id="search-clear" type="button" aria-label="Hapus pencarian" hidden>
                        <i class="fas fa-xmark" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===================== KATALOG ===================== -->
    <main class="section section--paper catalog">
        <div class="wrap">
            <div class="catalog__head">
                <h1 class="catalog__title">Mau nyemil apa hari ini?</h1>
            </div>

            <div id="menu-grid" class="mgrid" aria-live="polite"></div>

            <p class="catalog__foot">
                <i class="fas fa-circle-info" aria-hidden="true"></i>
                Harga belum termasuk ongkir. Konfirmasi ketersediaan &amp; ongkir lewat WhatsApp.
            </p>
        </div>
    </main>

    <!-- ===================== FOOTER ===================== -->

    <!-- ===================== POPUP ORDER ===================== -->
    <div class="sheet" id="order-sheet" aria-hidden="true">
        <div class="sheet__scrim" data-close></div>
        <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="order-title">
            <button class="sheet__close" type="button" data-close aria-label="Tutup">
                <i class="fas fa-xmark" aria-hidden="true"></i>
            </button>

            <div class="order-hero">
                <img class="order-hero__img" id="order-img" src="" alt="">
                <span class="order-hero__cat" id="order-cat"></span>
            </div>

            <div class="sheet__scroll">
                <h2 class="order-title" id="order-title"></h2>
                <p class="order-desc" id="order-desc"></p>
                <div class="order-price">
                    <span class="order-price__from" id="order-from" hidden></span>
                    <span class="order-price__now" id="order-price"></span>
                    <span class="order-price__was" id="order-was"></span>
                </div>

                <!-- Opsi -->
                <div class="opt-groups" id="opt-groups"></div>

                <!-- Jumlah -->
                <div class="opt-row">
                    <span class="opt-row__label">Jumlah</span>
                    <div class="qty qty--lg">
                        <button class="qty__btn" type="button" data-qty="dec" aria-label="Kurangi jumlah">&minus;</button>
                        <span class="qty__val" id="order-qty">1</span>
                        <button class="qty__btn" type="button" data-qty="inc" aria-label="Tambah jumlah">+</button>
                    </div>
                </div>

                <div class="opt-group opt-group--note">
                    <label class="opt-group__label" for="order-note">Catatan untuk item ini <span>(opsional)</span></label>
                    <input id="order-note" class="opt-input" type="text" placeholder="Contoh: saus dipisah, tanpa bawang">
                </div>
            </div>

            <div class="sheet__foot">
                <div class="sheet__total">
                    <span class="sheet__total-label">Subtotal</span>
                    <span class="sheet__total-val" id="order-total">Rp0</span>
                </div>
                <button class="btn btn--red btn--lg btn--block" id="order-add" type="button">
                    <i class="fas fa-cart-plus" aria-hidden="true"></i> Tambah ke Keranjang
                </button>
            </div>
        </div>
    </div>

    <!-- ===== BAR KERANJANG (mengambang bawah) ===== -->
    <div class="cartbar" id="cartbar" hidden>
        <button class="cartbar__btn" type="button" id="cart-open" aria-label="Lihat keranjang">
            <span class="cartbar__icon"><i class="fas fa-cart-shopping" aria-hidden="true"></i></span>
            <span class="cartbar__meta">
                <span class="cartbar__count" id="cart-count">0 item</span>
                <span class="cartbar__total" id="cart-total">Rp0</span>
            </span>
            <span class="cartbar__go">Lihat Keranjang <i class="fas fa-arrow-right" aria-hidden="true"></i></span>
        </button>
    </div>

    <!-- ===== PANEL KERANJANG ===== -->
    <div class="sheet sheet--cart" id="cart-sheet" aria-hidden="true">
        <div class="sheet__scrim" data-close></div>
        <div class="sheet__panel sheet__panel--cart" role="dialog" aria-modal="true" aria-labelledby="cart-title">
            <button class="sheet__close" type="button" data-close aria-label="Tutup">
                <i class="fas fa-xmark" aria-hidden="true"></i>
            </button>

            <div class="sheet__scroll">
                <h2 class="sheet__h" id="cart-title">
                    <i class="fas fa-cart-shopping" aria-hidden="true"></i> Keranjang Kamu
                </h2>
                <p class="sheet__sub" id="cart-sub">Belum ada item. Pilih menu dulu ya.</p>
                <div class="cart-list" id="cart-list"></div>
            </div>

            <div class="sheet__foot">
                <div class="opt-group opt-group--note">
                    <label class="opt-group__label" for="cust-name">Nama pemesan <span>(opsional)</span></label>
                    <input id="cust-name" class="opt-input" type="text" placeholder="Contoh: Dewa" autocomplete="name">
                </div>
                <div class="opt-group opt-group--note">
                    <label class="opt-group__label" for="cust-note">Catatan pesanan <span>(opsional)</span></label>
                    <input id="cust-note" class="opt-input" type="text" placeholder="Contoh: alamat, ongkir, jam ambil">
                </div>
                <div class="sheet__total">
                    <span class="sheet__total-label">Total <span id="cart-n">(0 item)</span></span>
                    <span class="sheet__total-val" id="cart-sum">Rp0</span>
                </div>
                <button class="btn btn--wa btn--lg btn--block" id="cart-submit" type="button" disabled>
                    <i class="fab fa-whatsapp" aria-hidden="true"></i> Kirim Pesanan via WhatsApp
                </button>
                <button class="btn btn--ghost btn--block cart-clear" type="button" id="cart-clear">
                    <i class="fas fa-trash-can" aria-hidden="true"></i> Kosongkan keranjang
                </button>
            </div>
        </div>
    </div>

    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
    <script src="assets/app.js?v=dn016"></script>
</body>

</html>
